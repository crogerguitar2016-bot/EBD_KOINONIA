<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EBD KOINONIA — Atos do Espírito Santo através dos Apóstolos</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f0e8;color:#243b35;font:17px system-ui}main{max-width:720px;margin:auto;padding:24px}header{background:#193b34;color:#f4dfae;padding:30px;border-radius:18px}h1{margin:0;font-size:34px}small{color:inherit}button,select,input{font:inherit;padding:14px;border-radius:10px;border:1px solid #b9c6bd}button{cursor:pointer;background:white;color:#193b34;text-align:left;width:100%;margin:5px 0}button.primary{background:#193b34;color:white;text-align:center}section{background:white;border-radius:16px;padding:20px;margin:18px 0}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{width:auto}progress{width:100%;accent-color:#39765b}.muted{color:#62736c}.correct{background:#d7efdc}.wrong{background:#f8d9d5}dialog{max-width:650px;width:94%;border:0;border-radius:16px;padding:24px}dialog::backdrop{background:#0008}label{display:block;margin:10px 0}h2{font-size:23px}</style><main><header><small>ESCOLA BÍBLICA • ATOS 8–12</small><h1>EBD KOINONIA</h1><h2>Atos do Espírito Santo através dos Apóstolos</h2><p>Cinco capítulos. Uma jornada de descobertas.</p></header><nav><button onclick="home()">Início</button><button onclick="bible()">Bíblia</button><button onclick="stats()">Resultados</button></nav><div id="view"></div></main><dialog id="reader"><h2>Consulta bíblica</h2><label>Capítulo <select id="chapter" onchange="read()"></select></label><div id="passage"></div><button onclick="reader.close()">Voltar</button></dialog><script>
const data=[
[8,'Detetive bíblico','Quem anunciou Cristo em Samaria?',['Pedro','Filipe','Saulo'],1,'8:5','Foi um dos sete escolhidos em Atos 6.','Filipe anunciou Cristo em Samaria.'],
[8,'Personagem misterioso','Quem lia Isaías durante uma viagem?',['Eunuco etíope','Simão','Cornélio'],0,'8:27–35','Era um oficial da rainha dos etíopes.','Filipe explicou as Escrituras ao viajante.'],
[9,'Encontre o erro','Saulo foi encontrado por Ananias em Jerusalém.',['Verdadeiro','Falso'],1,'9:10–19','A rua se chamava Direita.','O encontro aconteceu em Damasco.'],
[9,'Expedição','Em qual cidade Pedro encontrou Eneias?',['Jope','Lida','Cesareia'],1,'9:32–35','Pedro visitava os santos.','Eneias estava em Lida.'],
[10,'Personagem misterioso','Quem era o centurião da coorte italiana?',['Cornélio','Herodes','Barnabé'],0,'10:1–2','Morava em Cesareia.','Cornélio era centurião e temente a Deus.'],
[10,'Investigação','Onde Pedro estava hospedado quando recebeu a visão?',['Antioquia','Jope','Damasco'],1,'10:5–16','Na casa de Simão, o curtidor.','Pedro estava em Jope.'],
[11,'Descoberta','Onde os discípulos foram chamados cristãos pela primeira vez?',['Antioquia','Jerusalém','Samaria'],0,'11:26','Barnabé e Saulo ensinaram ali.','A designação surgiu em Antioquia.'],
[11,'Associação','Qual profeta anunciou uma grande fome?',['Ágabo','Silas','Ananias'],0,'11:27–30','Veio de Jerusalém.','Ágabo anunciou a fome.'],
[12,'Missão: Libertar Pedro','O que a igreja fazia enquanto Pedro estava preso?',['Jejuava por Herodes','Orava por Pedro','Viajava para Jope'],1,'12:5','A igreja estava reunida em oração.','A igreja orava intensamente por Pedro.'],
[12,'Personagem misterioso','Quem reconheceu a voz de Pedro à porta?',['Maria','Tabita','Rode'],2,'12:13–14','De alegria, não abriu a porta.','Rode reconheceu a voz de Pedro.']];
const summaries={8:'A perseguição dispersa os discípulos. Filipe anuncia Cristo em Samaria e explica Isaías ao oficial etíope. Pedro e João visitam Samaria.',9:'Saulo encontra Jesus no caminho de Damasco. Ananias o visita. Pedro cura Eneias em Lida e Tabita volta à vida em Jope.',10:'Cornélio recebe uma visão em Cesareia. Pedro recebe uma visão em Jope e anuncia Jesus na casa de Cornélio.',11:'Pedro explica a recepção dos gentios. Barnabé e Saulo ensinam em Antioquia. Ágabo anuncia uma fome.',12:'Herodes mata Tiago e prende Pedro. A igreja ora. Pedro é libertado por um anjo e vai à casa de Maria, onde Rode reconhece sua voz.'};
let items=[],i=0,score=0,answered=false,consults=0,mode='estudo',records=JSON.parse(localStorage.getItem('atos-results')||'[]');const v=document.querySelector('#view');
function home(){v.innerHTML='<section><h2>Escolha sua missão</h2><p>Sem cadastro. Aprenda no seu ritmo.</p><button class="primary" onclick="start(0)">Grande missão • 10 perguntas</button><button onclick="start(1)">Desafio rápido • 5 perguntas</button>'+[8,9,10,11,12].map(c=>`<button onclick="start(${c})">Missão Atos ${c}</button>`).join('')+'<label>Modalidade <select id="mode"><option value="estudo">Aprenda investigando</option><option value="desafio">Desafio de conhecimento</option></select></label></section>'}
function start(c){mode=document.querySelector('#mode').value;items=c===0?data:c===1?data.filter((_,j)=>j%2===0):data.filter(q=>q[0]===c);i=score=consults=0;question()}
function question(){answered=false;let q=items[i];v.innerHTML=`<section><small>${q[1]} • Atos ${q[0]} • ${i+1}/${items.length}</small><progress value="${i}" max="${items.length}"></progress><h2>${q[2]}</h2>${q[3].map((a,j)=>`<button class="option" onclick="answer(${j})">${a}</button>`).join('')}<button onclick="document.querySelector('#hint').hidden=false">Revelar pista</button><p id="hint" hidden>${q[6]}</p><button onclick="bible(${q[0]})">Consultar Bíblia / guia</button><div id="feedback"></div></section>`}
function answer(j){if(answered)return;answered=true;let q=items[i];if(j===q[4])score++;document.querySelectorAll('.option').forEach((b,k)=>{b.disabled=true;if(k===q[4])b.classList.add('correct');else if(k===j)b.classList.add('wrong')});document.querySelector('#feedback').innerHTML=`<h3>${j===q[4]?'Você acertou!':'Uma nova descoberta!'}</h3><p>${q[7]} — Atos ${q[5]}</p><button class="primary" onclick="next()">Continuar</button>`}
function next(){if(++i<items.length)return question();records.push({score,total:items.length,consults,date:new Date().toISOString()});localStorage.setItem('atos-results',JSON.stringify(records));v.innerHTML=`<section><h2>Missão concluída!</h2><h1>${score}/${items.length}</h1><p>Continue investigando as Escrituras.</p><button onclick="share()">Compartilhar resultado</button><button onclick="home()">Nova missão</button></section>`}
function share(){let text=`Concluí o desafio da EBD KOINONIA — Atos do Espírito Santo através dos Apóstolos! Acertei ${score} de ${items.length} perguntas.`;if(navigator.share)navigator.share({text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>alert('Resultado copiado')).catch(()=>prompt('Copie seu resultado',text));else prompt('Copie seu resultado',text)}
function bible(c=8){consults++;chapter.value=c;read();reader.showModal()}
function read(){let c=chapter.value;passage.innerHTML=`<p><strong>Guia de leitura — Atos ${c}</strong></p><p>${summaries[c]}</p><p class="muted">Resumo autoral, não é o texto integral da Bíblia. A tradução integral será incorporada após validação da licença.</p><a href="https://www.biblegateway.com/passage/?search=Acts%20${c}&version=ARC" target="_blank" rel="noopener">Abrir capítulo em uma Bíblia online</a>`}
function stats(){v.innerHTML=`<section><h2>Resultados neste aparelho</h2><p>Missões concluídas: ${records.length}</p><p>Acertos: ${records.reduce((a,r)=>a+r.score,0)} de ${records.reduce((a,r)=>a+r.total,0)}</p><p>Consultas: ${records.reduce((a,r)=>a+r.consults,0)}</p><p class="muted">Dados locais. Ainda não há painel coletivo conectado.</p></section>`}chapter.innerHTML=[8,9,10,11,12].map(c=>`<option>${c}</option>`).join('');home();</script></html>
