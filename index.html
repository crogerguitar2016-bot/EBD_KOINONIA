<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EBD KOINONIA — Atos do Espírito Santo através dos Apóstolos</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f0e8;color:#243b35;font:17px system-ui}main{max-width:720px;margin:auto;padding:24px}header{background:#193b34;color:#f4dfae;padding:30px;border-radius:18px}h1{margin:0;font-size:34px}small{color:inherit}button,select,input{font:inherit;padding:14px;border-radius:10px;border:1px solid #b9c6bd}button{cursor:pointer;background:white;color:#193b34;text-align:left;width:100%;margin:5px 0}button.primary{background:#193b34;color:white;text-align:center}section{background:white;border-radius:16px;padding:20px;margin:18px 0}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{width:auto}progress{width:100%;accent-color:#39765b}.muted{color:#62736c}.correct{background:#d7efdc}.wrong{background:#f8d9d5}dialog{max-width:650px;width:94%;border:0;border-radius:16px;padding:24px}dialog::backdrop{background:#0008}label{display:block;margin:10px 0}h2{font-size:23px}</style><main><header><small>ESCOLA BÍBLICA • ATOS 8–12</small><h1>EBD KOINONIA</h1><h2>Atos do Espírito Santo através dos Apóstolos</h2><p>Cinco capítulos. Uma jornada de descobertas.</p></header><nav><button onclick="home()">Início</button><button onclick="bible()">Bíblia</button><button onclick="stats()">Resultados</button></nav><div id="view"></div></main><dialog id="reader"><h2>Consulta bíblica</h2><label>Capítulo <select id="chapter" onchange="read()"></select></label><div id="passage"></div><button onclick="reader.close()">Voltar</button></dialog><script src="questoes-v03.js"></script><script>
const summaries={8:'A perseguição dispersa os discípulos. Filipe anuncia Cristo em Samaria e explica Isaías ao oficial etíope. Pedro e João visitam Samaria.',9:'Saulo encontra Jesus no caminho de Damasco. Ananias o visita. Pedro cura Eneias em Lida e Tabita volta à vida em Jope.',10:'Cornélio recebe uma visão em Cesareia. Pedro recebe uma visão em Jope e anuncia Jesus na casa de Cornélio.',11:'Pedro explica a recepção dos gentios. Barnabé e Saulo ensinam em Antioquia. Ágabo anuncia uma fome.',12:'Herodes mata Tiago e prende Pedro. A igreja ora. Pedro é libertado por um anjo e vai à casa de Maria, onde Rode reconhece sua voz.'};
let items=[],i=0,score=0,answered=false,consults=0,mode='estudo',records=loadRecords();
function loadRecords(){
  try {
    const saved=JSON.parse(localStorage.getItem('atos-results'));
    if(!Array.isArray(saved))return [];
    return saved.filter(record=>
      record!==null && typeof record==='object' && !Array.isArray(record) &&
      Number.isSafeInteger(record.score) && record.score>=0 &&
      Number.isSafeInteger(record.total) && record.total>0 &&
      record.score<=record.total &&
      Number.isSafeInteger(record.consults) && record.consults>=0 &&
      typeof record.date==='string' && Number.isFinite(Date.parse(record.date))
    );
  } catch {
    return [];
  }
}const v=document.querySelector('#view');
function shuffled(values) {
  const copy = values.slice();
  for (let last = copy.length - 1; last > 0; last--) {
    const selected = Math.floor(Math.random() * (last + 1));
    [copy[last], copy[selected]] = [copy[selected], copy[last]];
  }
  return copy;
}

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, character => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[character]);
}

function home() {
  v.innerHTML = `<section><h2>Escolha sua missão</h2>
    <p>Sem cadastro. Aprenda no seu ritmo.</p>
    <button class="primary" onclick="start(10)">Individual • 10 perguntas</button>
    <button onclick="start(5)">Desafio rápido • 5 perguntas</button>
    ${[8, 9, 10, 11, 12].map(c =>
      `<button onclick="start(16, ${c})">Missão Atos ${c} • 16 perguntas</button>`
    ).join('')}
    <button onclick="start(20)">Grande missão • 20 perguntas</button>
    <button onclick="start(40)">Super missão • 40 perguntas</button>
    <button onclick="start(80)">Maratona • 80 perguntas</button>
    <label>Modalidade <select id="mode">
      <option value="estudo">Aprenda investigando</option>
      <option value="desafio">Desafio de conhecimento</option>
    </select></label>
    <p id="bank-status" role="status" hidden></p></section>`;
}

function start(total, selectedChapter) {
  const source = window.EBD_QUESTOES_V03;
  if (!Array.isArray(source) || source.length !== 80) {
    const status = document.querySelector('#bank-status');
    status.textContent = 'Banco de questões indisponível. Verifique se questoes-v03.js está junto ao index.html e recarregue a página.';
    status.hidden = false;
    return;
  }
  mode = document.querySelector('#mode').value;
  const pool = selectedChapter === undefined ? source :
    source.filter(q => q.capitulo === selectedChapter);
  items = shuffled(pool).slice(0, total).map(q => {
    const order = shuffled(q.alternativas.map((_, index) => index));
    return {
      ...q,
      alternativas: order.map(index => q.alternativas[index]),
      indiceRespostaCorreta: order.indexOf(q.indiceRespostaCorreta)
    };
  });
  i = score = consults = 0;
  question();
}

function question() {
  answered = false;
  const q = items[i];
  v.innerHTML = `<section>
    <small>${escapeHtml(q.titulo)} • Atos ${q.capitulo} • ${i + 1}/${items.length}</small>
    <progress value="${i}" max="${items.length}"></progress>
    <h2>${escapeHtml(q.pergunta)}</h2>
    ${q.alternativas.map((a, j) =>
      `<button class="option" onclick="answer(${j})">${escapeHtml(a)}</button>`
    ).join('')}
    <button onclick="document.querySelector('#hint').hidden=false">Revelar pista</button>
    <p id="hint" hidden>${escapeHtml(q.pista)}</p>
    <button onclick="bible(${q.capitulo})">Consultar Bíblia / guia</button>
    <div id="feedback"></div></section>`;
}

function answer(j) {
  if (answered) return;
  answered = true;
  const q = items[i];
  const correct = q.indiceRespostaCorreta;
  if (j === correct) score++;
  document.querySelectorAll('.option').forEach((button, index) => {
    button.disabled = true;
    if (index === correct) button.classList.add('correct');
    else if (index === j) button.classList.add('wrong');
  });
  document.querySelector('#feedback').innerHTML =
    `<h3>${j === correct ? 'Você acertou!' : 'Uma nova descoberta!'}</h3>
    <p>${escapeHtml(q.explicacao)} — ${escapeHtml(q.referenciaBiblica)}</p>
    <button class="primary" onclick="next()">Continuar</button>`;
}
function next(){if(++i<items.length)return question();records.push({score,total:items.length,consults,date:new Date().toISOString()});try {
  localStorage.setItem('atos-results',JSON.stringify(records));
} catch {
  // O resultado permanece em memoria para esta sessao.
}v.innerHTML=`<section><h2>Missão concluída!</h2><h1>${score}/${items.length}</h1><p>Continue investigando as Escrituras.</p><button onclick="share()">Compartilhar resultado</button><button onclick="home()">Nova missão</button></section>`}
function share(){let text=`Concluí o desafio da EBD KOINONIA — Atos do Espírito Santo através dos Apóstolos! Acertei ${score} de ${items.length} perguntas.`;if(navigator.share)navigator.share({text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>alert('Resultado copiado')).catch(()=>prompt('Copie seu resultado',text));else prompt('Copie seu resultado',text)}
function bible(c=8){consults++;chapter.value=c;read();reader.showModal()}
function read(){let c=chapter.value;passage.innerHTML=`<p><strong>Guia de leitura — Atos ${c}</strong></p><p>${summaries[c]}</p><p class="muted">Resumo autoral, não é o texto integral da Bíblia. A tradução integral será incorporada após validação da licença.</p><a href="https://www.biblegateway.com/passage/?search=Acts%20${c}&version=ARC" target="_blank" rel="noopener">Abrir capítulo em uma Bíblia online</a>`}
function stats(){v.innerHTML=`<section><h2>Resultados neste aparelho</h2><p>Missões concluídas: ${records.length}</p><p>Acertos: ${records.reduce((a,r)=>a+r.score,0)} de ${records.reduce((a,r)=>a+r.total,0)}</p><p>Consultas: ${records.reduce((a,r)=>a+r.consults,0)}</p><p class="muted">Dados locais. Ainda não há painel coletivo conectado.</p></section>`}chapter.innerHTML=[8,9,10,11,12].map(c=>`<option>${c}</option>`).join('');home();</script></html>
