<main><header><small>ESCOLA BÍBLICA • ATOS 8–12</small><h1>EBD KOINONIA</h1><h2>Atos do Espírito Santo através dos Apóstolos</h2><p>Cinco capítulos. Uma jornada de descobertas.</p><p>Professor: Pastor Carlos Rogério</p></header><nav><button onclick="home()">Início</button><button id="nav-bible" onclick="bible()">Bíblia</button><button onclick="stats()">Resultados</button><button onclick="location.href='estudo-biblico.html'">Estudo Bíblico</button><button type="button" onclick="location.href='principais-textos.html'">Principais Textos Bíblicos</button></nav><p id="aluno-mode">Modo livre</p><button type="button" id="aluno-open">Modo acompanhado</button><button type="button" id="turma-open">Modo turma</button><div id="view"></div></main><div id="aluno-recovery" hidden style="max-width:58rem;margin:auto;padding:0 1rem"><p id="aluno-status" role="status"></p><button type="button" id="aluno-retry" hidden>Tentar gravar novamente</button><button type="button" id="aluno-reopen" hidden>Reabrir a página</button></div>
<dialog id="aluno-confirm" aria-labelledby="aluno-confirm-title" aria-describedby="aluno-confirm-copy">
  <h2 id="aluno-confirm-title"></h2><p id="aluno-confirm-copy"></p>
  <button type="button" value="cancelar" autofocus>Cancelar</button>
  <button type="button" value="sim">Confirmar</button>
</dialog>
<dialog id="turma-dialog" aria-labelledby="turma-title" class="aluno-panel">
  <h2 id="turma-title">Modo turma</h2><div id="turma-content"></div>
  <p id="turma-status" role="status"></p>
  <button type="button" data-close autofocus>Fechar modo turma</button>
</dialog>
<dialog id="reader"><h2>Consulta bíblica</h2><label>Capítulo <select id="chapter" onchange="read()"></select></label><div id="passage"></div><button onclick="document.querySelector('#reader').close()">Voltar</button></dialog><script src="questoes-v03.js"></script><script>
const summaries={8:'A perseguição dispersa os discípulos. Filipe anuncia Cristo em Samaria e explica Isaías ao oficial etíope. Pedro e João visitam Samaria.',9:'Saulo encontra Jesus no caminho de Damasco. Ananias o visita. Pedro cura Eneias em Lida e Tabita volta à vida em Jope.',10:'Cornélio recebe uma visão em Cesareia. Pedro recebe uma visão em Jope e anuncia Jesus na casa de Cornélio.',11:'Pedro explica a recepção dos gentios. Barnabé e Saulo ensinam em Antioquia. Ágabo anuncia uma fome.',12:'Herodes mata Tiago e prende Pedro. A igreja ora. Pedro é libertado por um anjo e vai à casa de Maria, onde Rode reconhece sua voz.'};

const bank = window.EBD_QUESTOES_V03;
const chapters = [8, 9, 10, 11, 12];
const weights = {'Fácil': 100, 'Intermediária': 150, 'Avançada': 200};
const byId = new Map(Array.isArray(bank) ? bank.map(q => [q.id, q]) : []);
const view = document.querySelector('#view');
const reader = document.querySelector('#reader');
const chapter = document.querySelector('#chapter');
const passage = document.querySelector('#passage');
const navBible = document.querySelector('#nav-bible');
const safeInt = n => Number.isSafeInteger(n) && n >= 0;

let active = null;
let completed = null;
let inActivity = false;
let tickingSince = null;
const records = [];

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[ch]);
}

function shuffled(values) {
  const copy = values.slice();
  for (let last = copy.length - 1; last > 0; last--) {
    const selected = Math.floor(Math.random() * (last + 1));
    [copy[last], copy[selected]] = [copy[selected], copy[last]];
  }
  return copy;
}

function currentItem() {
  return active ? active.items[active.index] : null;
}

function readerLocked() {
  return active?.mode === 'desafio' && currentItem().choice === null;
}

function updateNavigation() {
  navBible.disabled = Boolean(readerLocked());
}

function startClock() {
  if (active && inActivity && !document.hidden && tickingSince === null) {
    tickingSince = performance.now();
  }
}

function checkpoint() {
  if (tickingSince === null) return;
  const now = performance.now();
  active.elapsed += Math.max(0, Math.round(now - tickingSince));
  tickingSince = now;
}

function pauseClock() {
  checkpoint();
  tickingSince = null;
}

function duration(ms) {
  const seconds = Math.floor(ms / 1000);
  return [Math.floor(seconds / 3600), Math.floor(seconds / 60) % 60, seconds % 60]
    .map(n => String(n).padStart(2, '0')).join(':');
}

function updateClock() {
  const clock = document.querySelector('#elapsed');
  if (clock && active) {
    const pending = tickingSince === null ? 0 : performance.now() - tickingSince;
    clock.textContent = duration(active.elapsed + pending);
  }
}

function stopViewing() {
  pauseClock();
  inActivity = false;
}

function home() {
  stopViewing();
  updateNavigation();
  view.innerHTML = `<section><h2>Escolha sua missão</h2>
    ${active ? '<button class="primary" onclick="resume()">Retomar atividade</button>' : ''}
    <label>Modalidade <select id="mode">
      <option value="estudo">Estudo</option>
      <option value="desafio">Desafio</option>
    </select></label>
    <div class="missions">
      <button class="primary" onclick="start(10)">Individual • 10 perguntas</button>
      <button onclick="start(5)">Desafio rápido • 5 perguntas</button>
      ${chapters.map(c => `<button onclick="start(16,${c})">Missão Atos ${c} • 16 perguntas</button>`).join('')}
      <button onclick="start(20)">Grande missão • 20 perguntas</button>
      <button onclick="start(40)">Super missão • 40 perguntas</button>
      <button onclick="start(80)">Maratona • 80 perguntas</button>
    </div><p id="bank-status" role="status" hidden></p></section>`;
  if (active) document.querySelector('#mode').value = active.mode;
}

function start(total, selectedChapter, replacementApproved = false, requestedMode) {
  if (inActivity || ![5, 10, 16, 20, 40, 80].includes(total)) return;
  const pool = byId.size !== 80 ? [] :
    selectedChapter === undefined ? bank : bank.filter(q => q.capitulo === selectedChapter);
  if (pool.length < total) {
    const bankStatus = document.querySelector('#bank-status');
    bankStatus.textContent = 'Banco de questões indisponível. Verifique o arquivo questoes-v03.js.';
    bankStatus.hidden = false;
    return;
  }
  if (active && !replacementApproved && !confirm('Substituir a atividade em andamento?')) return;
  active = {
    mode: requestedMode || document.querySelector('#mode').value, elapsed: 0, index: 0,
    items: shuffled(pool).slice(0, total).map(q => ({
      id: q.id, order: shuffled(q.alternativas.map((_, index) => index)),
      choice: null, hint: false, consults: 0, assistedConsults: 0
    }))
  };
  resume();
}

function resume() {
  if (!active) return;
  inActivity = true;
  startClock();
  question(true);
}

function activityQuestion(activity, item) {
  return activity?.questions?.find(q => q.id === item.id) ?? byId.get(item.id);
}

function resultOf(item, activity = active) {
  const q = activityQuestion(activity, item);
  const correct = item.choice !== null && item.order[item.choice] === q.indiceRespostaCorreta;
  const multiplier = activity.mode === 'desafio' ? 2 :
    item.hint && item.assistedConsults ? 0.5 : item.hint || item.assistedConsults ? 0.75 : 1;
  return {correct, points: correct ? Math.round(weights[q.dificuldade] * multiplier) : 0};
}

function totals(activity = active) {
  return activity.items.reduce((sum, item) => {
    if (item.choice === null) return sum;
    const result = resultOf(item, activity);
    sum.answered++;
    sum.score += Number(result.correct);
    sum.points += result.points;
    return sum;
  }, {answered: 0, score: 0, points: 0});
}

function question(focus = false) {
  const item = currentItem();
  const q = activityQuestion(active, item);
  const done = item.choice !== null;
  const correctIndex = item.order.indexOf(q.indiceRespostaCorreta);
  const sum = totals();
  const hintAllowed = active.mode === 'estudo';
  updateNavigation();
  view.innerHTML = `<section>
    <small>${escapeHtml(q.titulo)} • Atos ${q.capitulo} • ${active.mode === 'estudo' ? 'Estudo' : 'Desafio'}</small>
    <div class="metrics">
      <p>Respondidas ${sum.answered}/${active.items.length}</p>
      <p>Acertos ${sum.score}</p><p>Pontos ${sum.points}</p>
      <p>Tempo <span id="elapsed">${duration(active.elapsed)}</span></p>
    </div>
    <progress aria-label="Perguntas respondidas" value="${sum.answered}" max="${active.items.length}"></progress>
    <h2 id="question-title" tabindex="-1">${active.index + 1}. ${escapeHtml(q.pergunta)}</h2>
    ${item.order.map((option, j) => {
      const style = done && j === correctIndex ? 'correct' : done && j === item.choice ? 'wrong' : '';
      const label = style === 'correct' ? ' — resposta correta' : style === 'wrong' ? ' — sua resposta' : '';
      return `<button class="option ${style}" ${done ? 'disabled' : ''} onclick="answer(${j})">${escapeHtml(q.alternativas[option])}${label}</button>`;
    }).join('')}
    ${hintAllowed && !done && !item.hint ? '<button onclick="revealHint()">Revelar pista</button>' : ''}
    ${hintAllowed && item.hint ? `<p id="hint" tabindex="-1"><strong>Pista</strong> ${escapeHtml(q.pista)}</p>` : ''}
    ${hintAllowed || done ? `<button onclick="bible(${q.capitulo})">Consultar Bíblia / guia</button>` : ''}
    ${done ? `<div id="feedback" tabindex="-1">
      <h3>${item.choice === correctIndex ? 'Você acertou!' : 'Uma nova descoberta!'}</h3>
      <p>${escapeHtml(q.explicacao)} — ${escapeHtml(q.referenciaBiblica)}</p>
      <p>+${resultOf(item).points} pontos</p>
      <button class="primary" onclick="next()">${active.index + 1 === active.items.length ? 'Concluir' : 'Continuar'}</button>
    </div>` : ''}</section>`;
  updateClock();
  if (focus) document.querySelector('#question-title').focus();
}

function revealHint() {
  const item = currentItem();
  if (!inActivity || active?.mode !== 'estudo' || item.choice !== null || item.hint) return;
  item.hint = true;
  question();
  document.querySelector('#hint').focus();
}

function answer(j) {
  const item = currentItem();
  if (!inActivity || !item || item.choice !== null || !safeInt(j) || j >= item.order.length) return;
  item.choice = j;
  checkpoint();
  question();
  document.querySelector('#feedback').focus();
}

function next() {
  const item = currentItem();
  if (!inActivity || !item || item.choice === null) return;
  if (active.index + 1 < active.items.length) {
    active.index++;
    question(true);
    return;
  }
  pauseClock();
  const result = makeResult(active, new Date().toISOString());
  completed = result;
  records.push(result);
  active = null;
  inActivity = false;
  showResult();
}

function makeResult(activity, date) {
  const sum = totals(activity);
  return {
    mode: activity.mode, date,
    total: activity.items.length, score: sum.score, points: sum.points,
    elapsed: activity.elapsed, consults: activity.items.reduce((n, row) => n + row.consults, 0),
    answers: activity.items.map(row => {
      const q = activityQuestion(activity, row);
      return {id: q.id, chapter: q.capitulo, category: q.categoria,
        difficulty: q.dificuldade, hint: row.hint, consults: row.consults, ...resultOf(row, activity)};
    })
  };
}

function showResult() {
  updateNavigation();
  view.innerHTML = `<section><h2>Missão concluída!</h2>
    <h1>${completed.score}/${completed.total}</h1>
    <p>${completed.points} pontos • ${duration(completed.elapsed)}</p>
    <details><summary>Cartão de desempenho</summary>
      <p>${completed.mode === 'desafio' ? 'Desafio' : 'Estudo'} • ${completed.consults} consultas</p>
      ${breakdown(completed.answers)}</details>
    ${window.EBDAluno?.selected ? '' : `<p><a href="https://wa.me/?text=${encodeURIComponent(shareText())}" target="_blank" rel="noopener">Compartilhar pelo WhatsApp</a></p>
    <button onclick="share()">Compartilhar resultado</button>`}
    <button onclick="certificate()">Certificado</button>
    <button onclick="home()">Nova missão</button></section>`;
}

function certificate() {
  if (!completed) return;
  const name = prompt('Nome para o certificado', '');
  if (!name?.trim()) return;
  view.innerHTML = `<section id="certificate">
    <h2>Certificado de conclusão</h2>
    <p>EBD KOINONIA • Atos 8–12</p>
    <h3>${escapeHtml(name.trim())}</h3>
    <p>Concluiu a missão no modo ${completed.mode === 'desafio' ? 'Desafio' : 'Estudo'}
      com ${completed.score}/${completed.total} acertos e ${completed.points} pontos.</p>
    <p>${escapeHtml(new Date(completed.date).toLocaleDateString('pt-BR'))}</p>
    <button onclick="window.print()">Imprimir certificado</button>
    <button onclick="showResult()">Voltar ao resultado</button>
  </section>`;
}

function shareText() {
  return `Concluí uma missão da EBD KOINONIA — Atos do Espírito Santo através dos Apóstolos! Acertei ${completed.score} de ${completed.total} perguntas.`;
}

function share() {
  if (!completed || window.EBDAluno?.selected) return;
  const text = shareText();
  if (navigator.share) navigator.share({text}).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(text)
    .then(() => alert('Resultado copiado')).catch(() => prompt('Copie seu resultado', text));
  else prompt('Copie seu resultado', text);
}

function bible(c = 8) {
  if (readerLocked() || !chapters.includes(c) || reader.open) return;
  const item = currentItem();
  if (item && inActivity) {
    item.consults++;
    if (item.choice === null) item.assistedConsults++;
  }
  chapter.value = String(c);
  read();
  reader.showModal();
}

function read() {
  const c = Number(chapter.value);
  if (!chapters.includes(c)) return;
  passage.innerHTML = `<p><strong>Guia de leitura — Atos ${c}</strong></p>
    <p>${escapeHtml(summaries[c])}</p>
    <p class="muted">Resumo autoral do capítulo.</p>
    <a href="https://www.biblegateway.com/passage/?search=Acts%20${c}&amp;version=ARC" target="_blank" rel="noopener">Abrir capítulo em uma Bíblia online</a>`;
}

function breakdown(answers, detailed = false) {
  if (!answers.length && !detailed) return '';
  const dimensions = [['chapter', 'Capítulo'], ['category', 'Categoria'], ['difficulty', 'Dificuldade']];
  return `<div class="breakdown">${dimensions.map(([key, title]) => {
    const groups = new Map();
    if (detailed && key === 'chapter') {
      for (const c of chapters) groups.set('Atos ' + c, {correct: 0, count: 0, points: 0});
    }
    if (detailed && key !== 'chapter' && !answers.length) return '';
    for (const row of answers) {
      const label = key === 'chapter' ? `Atos ${row.chapter}` : row[key];
      const sum = groups.get(label) || {correct: 0, count: 0, points: 0};
      sum.correct += Number(row.correct);
      sum.count++;
      sum.points += row.points;
      groups.set(label, sum);
    }
    const labels = [...groups.keys()].sort((a,b) => a.localeCompare(b, 'pt-BR', {numeric:true}));
    return `<div><h3>${title}</h3><ul>${labels.map(label => {
      const {correct, count, points} = groups.get(label);
      if (!count) return `<li>${escapeHtml(label)} — capítulo não estudado</li>`;
      const percentage = Math.round(100 * correct / count);
      return `<li>${escapeHtml(label)} — ${correct}/${count} acertos (${percentage}%) • ${points} pts
        ${detailed ? `<progress aria-label="Aproveitamento em ${escapeHtml(label)}" max="100" value="${percentage}"></progress>` : ''}</li>`;
    }).join('')}</ul></div>`;
  }).join('')}</div>`;
}

function stats() {
  stopViewing();
  const sum = key => records.reduce((n, r) => n + r[key], 0);
  const mostRecent = [...records].sort((a, b) => Date.parse(b.date) - Date.parse(a.date));
  if (window.EBDAluno?.selected) {
    const answered = sum('total');
    const correct = sum('score');
    const rows = records.flatMap(record => record.answers);
    const covered = new Set(rows.filter(row => byId.has(row.id)).map(row => row.id)).size;
    const percentage = answered ? Math.round(100 * correct / answered) : null;
    const missions = records.length === 1 ? '1 missão concluída' : records.length + ' missões concluídas';
    view.innerHTML = `<section class="aluno-results"><h2>Painel individual de desempenho</h2>
      ${active ? `<p>${escapeHtml(window.EBDAluno.summary(active))}</p>
        <button class="primary" onclick="resume()">Retomar atividade</button>` : ''}
      <h3>Missões concluídas</h3>
      <p>${missions} · ${answered} perguntas respondidas · ${correct} acertos · ${answered - correct} erros</p>
      <p>Aproveitamento ${percentage === null ? 'indisponível' : percentage + '%'}</p>
      ${percentage === null ? '' : `<progress aria-label="Aproveitamento geral" max="100" value="${percentage}"></progress>`}
      <p>${sum('points')} pontos · ${sum('consults')} consultas bíblicas · ${duration(sum('elapsed'))} de tempo registrado</p>
      <p>Cobertura do banco atual nas missões concluídas · ${covered}/${byId.size} perguntas distintas</p>
      ${byId.size ? `<progress aria-label="Cobertura do banco" max="${byId.size}" value="${covered}"></progress>` : ''}
      ${breakdown(rows, true)}
      <h3>Histórico</h3>
      ${mostRecent.length ? mostRecent.map(record => `<details><summary>${escapeHtml(new Date(record.date).toLocaleString('pt-BR'))}
        · ${record.mode === 'desafio' ? 'Desafio' : 'Estudo'} · ${record.score}/${record.total} acertos</summary>
        <p>${record.points} pontos · ${record.consults} consultas bíblicas · ${duration(record.elapsed)}</p>
        ${breakdown(record.answers)}</details>`).join('') : '<p>Sem missões concluídas.</p>'}
      <p class="muted">Resultados calculados localmente, sem verificação externa.</p></section>`;
    return;
  }
  view.innerHTML = `<section><h2>${window.EBDAluno?.selected ? 'Painel individual de desempenho' : 'Resultados desta página'}</h2>
    <p>Missões concluídas ${records.length} • Acertos ${sum('score')}/${sum('total')} • Consultas ${sum('consults')}</p>
    ${breakdown(records.flatMap(r => r.answers))}
    ${mostRecent.map(r => `<details><summary>${escapeHtml(new Date(r.date).toLocaleString('pt-BR'))}
      • ${r.mode === 'desafio' ? 'Desafio • ' : r.mode === 'estudo' ? 'Estudo • ' : ''}${r.score}/${r.total} acertos</summary>
      <p>${r.consults} consultas${safeInt(r.points) && safeInt(r.elapsed) ?
        ` • ${r.points} pontos • ${duration(r.elapsed)}` : ''}</p>${breakdown(r.answers)}</details>`).join('')}
    <p class="muted">${window.EBDAluno?.selected ? 'Resultados calculados localmente, sem verificação externa.' : 'Resultados disponíveis enquanto esta página estiver aberta.'}</p></section>`;
}

chapter.innerHTML = chapters.map(c => `<option value="${c}">${c}</option>`).join('');
document.addEventListener('visibilitychange', () => {
  if (document.hidden) pauseClock();
  else startClock();
  updateClock();
});
window.addEventListener('pagehide', pauseClock);
window.addEventListener('pageshow', startClock);
setInterval(() => {
  checkpoint();
  updateClock();
}, 1000);
home();
</script><script src="aluno-dados.js"></script><script src="aluno.js"></script><script src="explorar.js"></script><script src="turma-core.js"></script><script src="turma.js"></script></html>
